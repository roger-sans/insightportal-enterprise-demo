name: InsightPortal CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 90
      - name: Check portal, contract and demo mode
        run: |
          curl --fail --silent http://127.0.0.1:8000/ | grep "InsightPortal"
          curl --fail --silent http://127.0.0.1:8000/api/v1/dashboard | python -c 'import json,sys; d=json.load(sys.stdin); assert len(d["metrics"]) == 8 and d["mode"] == "local"'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
